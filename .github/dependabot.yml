# rec #24: keep the SHA-pinned GitHub Actions current. Everything in .github/workflows
# is pinned to an immutable commit SHA (good — supply-chain hygiene), but pins rot
# without auto-updates. Dependabot is native (no third-party app, unlike Renovate) and
# understands SHA-pinned actions: it bumps the SHA and refreshes the version comment.
# Grouped into one weekly PR to keep review light.
#
# Not covered here (would need Renovate + a custom manager): the Kyverno Helm chart
# targetRevision in security/kyverno-app.yaml, and the inline `pip install` deps in
# build-stage-scan.yaml (no requirements file to track).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # Supply-chain cooldown for the radar image's npm deps (weathermap/app).
  # The Dockerfile does `npm ci` from the committed lockfile, so poisoned
  # versions can only enter via a lockfile bump. Cooldown makes Dependabot wait
  # until a release is 7 days old before proposing it, which outlives the
  # typical publish-to-takedown window of npm supply-chain attacks. 2026-08-31.
  - package-ecosystem: "npm"
    directory: "/weathermap/app"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
