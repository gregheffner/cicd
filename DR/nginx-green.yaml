apiVersion: apps/v1
kind: Deployment # P2: was DaemonSet
metadata:
  labels:
    app: nginx-web
    version: green
  name: nginx-web-green
  namespace: prod
spec:
  replicas: 3 # P2: mirror blue
  strategy: # surge-first: never drop below desired Ready
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1 # anti-affinity is preferred (not required), so a surge pod can double up on a node during the roll
      maxUnavailable: 0 # never drop below desired Ready
  minReadySeconds: 10 # rec #23: a new pod must stay Ready 10s before the roll proceeds (catches crash-after-ready)
  selector:
    matchLabels:
      app: nginx-web
      version: green
  template:
    metadata:
      labels:
        app: nginx-web
        version: green
      annotations:
        ad.datadoghq.com/nginx.checks: |
          {
            "nginx": {
              "init_config": {},
              "instances": [
                {
                  "nginx_status_url":"http://%%host%%:8081/nginx_status/"
                }
              ]
            }
          }
        ad.datadoghq.com/nginx.logs: '[{"source":"nginx","service":"nginx"}]'
    spec:
      terminationGracePeriodSeconds: 30 # P4
      securityContext:
        fsGroup: 65533 # git-sync gid: makes the 0440 deploy key readable; nginx (101) still writes its emptyDirs via 0777
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity: # PREFERRED: spread one green pod per node by default, but allow doubling up so the HPA can scale past 3
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: nginx-web
                    version: green
      # fail2ban runs as a NATIVE SIDECAR (initContainer + restartPolicy: Always, k8s >=1.29).
      # Outage review 2026-06-25: as a plain sidecar with no readinessProbe, a fail2ban
      # OOM/liveness restart flipped Pod.Ready=false and ejected the healthy nginx from the
      # Service. As a native sidecar it no longer gates Pod.Ready, so its restarts never
      # pull nginx out of nginx-service.
      initContainers:
        - name: nginx-log-init # fail2ban is a native sidecar that starts BEFORE nginx and refuses to load a jail whose logpath is missing; the emptyDir starts empty (the old hostPath always carried a file over from the previous pod), so pre-create the logs as nginx's uid
          image: busybox:1.36
          command: ["sh", "-c", "touch /var/log/nginx/access.log /var/log/nginx/error.log"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 101 # nginx's uid: it must own the files it appends to; fail2ban (root) only reads them
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 1m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - mountPath: /var/log/nginx
              name: nginx-logs
        # 2026-09-03 (CIS C2): blog + images come from the www repo via git-sync into an
        # emptyDir, replacing three hostPaths and the per-worker GitHub runners that used to
        # `git pull` on the node. The repo is private: read-only deploy key via ESO
        # (Secret www-deploy-key). One-time clone first so nginx never starts without
        # content; then a native sidecar re-pulls every 5 min.
        - name: git-sync-init # blocks until the first clone exists
          image: registry.k8s.io/git-sync/git-sync:v4.7.1
          args:
            - --repo=git@github.com:gregheffner/www.git
            - --ref=main
            - --root=/git
            - --link=www
            - --depth=1
            - --ssh-key-file=/etc/git-secret/ssh
            - --ssh-known-hosts-file=/etc/git-secret/known_hosts
            - --one-time
          securityContext:
            runAsNonRoot: true
            runAsUser: 65533 # the image's git-sync user
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - mountPath: /git
              name: www-content
            - mountPath: /etc/git-secret
              name: www-deploy-key
              readOnly: true
            - mountPath: /tmp
              name: git-sync-tmp
        - name: git-sync # continuous
          image: registry.k8s.io/git-sync/git-sync:v4.7.1
          restartPolicy: Always # native sidecar: keeps /git/www current; nginx follows the symlink at request time
          args:
            - --repo=git@github.com:gregheffner/www.git
            - --ref=main
            - --root=/git
            - --link=www
            - --depth=1
            - --ssh-key-file=/etc/git-secret/ssh
            - --ssh-known-hosts-file=/etc/git-secret/known_hosts
            - --period=300s # 5 min, not 60s: UniFi IPS sig 2003068 (ET SCAN Potential SSH Scan OUTBOUND) fires on ordinary git-over-ssh from the workers; fewer sessions = less to suppress
          securityContext:
            runAsNonRoot: true
            runAsUser: 65533 # the image's git-sync user
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - mountPath: /git
              name: www-content
            - mountPath: /etc/git-secret
              name: www-deploy-key
              readOnly: true
            - mountPath: /tmp
              name: git-sync-tmp
        - name: fail2ban
          image: crazymax/fail2ban:1.1.0 # 2026-09-03 (C3): pinned; was :latest
          restartPolicy: Always # makes this restartable init container a native sidecar
          resources:
            requests:
              cpu: 1m
              memory: 64Mi # rec #6
            limits:
              memory: 256Mi # rec #6 (raised 128->256 per outage review; live RSS ~34Mi)
          livenessProbe: # rec #9b: restart if the fail2ban server stops responding
            exec:
              command: ["fail2ban-client", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext: # rec #2: deprivileged — bans go via the Cloudflare API, not local iptables
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /etc/fail2ban/action.d/cloudflare-ban.conf
              name: fail2ban-config-cloudflare
              subPath: cloudflare-ban.conf
            - mountPath: /etc/cloudflare
              name: cloudflare-creds
            - mountPath: /usr/local/bin/fail2ban-cloudflare-ban.sh
              name: ban-script
              subPath: fail2ban-cloudflare-ban.sh
            - mountPath: /usr/local/bin/fail2ban-cloudflare-unban.sh
              name: ban-script
              subPath: fail2ban-cloudflare-unban.sh
            - mountPath: /usr/local/bin/is-dd-synthetic.sh
              name: ban-script
              subPath: is-dd-synthetic.sh
            - mountPath: /etc/fail2ban/fail2ban.conf
              name: fail2ban-main-config
              subPath: fail2ban.conf
            - mountPath: /etc/fail2ban/jail.local
              name: fail2ban-config
              subPath: jail.local
            - mountPath: /etc/fail2ban/filter.d/nginx-404.conf
              name: fail2ban-config
              subPath: nginx-404.conf
            - mountPath: /var/log/nginx
              name: nginx-logs
      containers:
        - name: nginx
          image: technotuba/nginx@sha256:f8ce1b39e42abc9ba563ac9e596929b2214b9e53aac43bbd758bd065b2595857 # P0: pinned to current running digest
          imagePullPolicy: IfNotPresent # P0: was Always
          securityContext: # harden: non-root, read-only rootfs, no caps (listeners now >=1024)
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: nginx-status
          readinessProbe: # P3
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          startupProbe: # rec #23: gate liveness until nginx is up; generous (30s) so it never false-kills
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe: # rec #7/#22: restart if nginx stops serving (cheap /healthz, no disk)
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle: # P4
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5; nginx -s quit"]
          resources: # P5: realistic request so HPA Utilization is meaningful
            requests:
              cpu: 250m
              memory: 64Mi # rec #6
            limits:
              cpu: "1"
              memory: 256Mi # rec #6: bound rss (static server is light; generous headroom vs OOM)
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: www-volume
            - mountPath: /etc/nginx/nginx.conf
              name: config-volume
              subPath: nginx.conf
            - mountPath: /content # git-sync checkout; nginx serves /blog/ and /image/ from /content/www (shared/nginx-config.yaml)
              name: www-content
              readOnly: true
            - mountPath: /etc/nginx/conf.d/status.conf
              name: config
              readOnly: true
              subPath: status.conf
            - mountPath: /var/log/nginx
              name: nginx-logs
            - mountPath: /var/cache/nginx # writable temp dirs for readOnlyRootFilesystem
              name: nginx-cache
            - mountPath: /var/run # nginx pid file (pid /var/run/nginx.pid)
              name: nginx-run
            - mountPath: /tmp
              name: nginx-tmp
      automountServiceAccountToken: false # rec #4: static web server never calls the k8s API
      serviceAccountName: nginx # rec #4b: dedicated zero-RoleBinding SA (was shared 'prod' SA); see shared/nginx-sa.yaml
      volumes:
        - name: nginx-logs # was hostPath /var/log/nginx; emptyDir means fail2ban no longer re-scans persisted logs on pod roll
          emptyDir: {}
        - configMap:
            name: fail2ban-config
          name: fail2ban-config-cloudflare
        - configMap:
            name: fail2ban-cloudflare-ban-script
            defaultMode: 0755
          name: ban-script
        - name: cloudflare-creds
          secret:
            secretName: cloudflare-creds
        - configMap:
            name: fail2ban-main-config
          name: fail2ban-main-config
        - configMap:
            name: nginx-config
          name: config
        - configMap:
            name: fail2ban-config
          name: fail2ban-config
        - configMap:
            name: www-configmap
          name: www-volume
        - configMap:
            name: nginx-config
          name: config-volume
        - name: www-content # git-sync checkout (emptyDir is 0777: git-sync uid 65533 writes 0755/0644, nginx uid 101 reads)
          emptyDir: {}
        - name: git-sync-tmp
          emptyDir: {}
        - name: www-deploy-key # ESO -> external-secrets/es-www-deploy-key.yaml; keys ssh + known_hosts land on git-sync's default paths
          secret:
            secretName: www-deploy-key
            defaultMode: 0440
        - name: nginx-cache # readOnlyRootFilesystem writable mounts (emptyDir is 0777 -> uid 101 writes; no fsGroup)
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
