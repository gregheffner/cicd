apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: prod
data:
  nginx.conf: |-
    user  nginx;
    worker_processes  auto;
    worker_rlimit_nofile 8192;               # rec #23: raise per-worker fd ceiling (pairs with worker_connections)

    error_log  /var/log/nginx/error.log crit;
    error_log  /dev/stderr;
    pid        /var/run/nginx.pid;

    events {
        worker_connections  4096;            # rec #23: was 1024 (per-worker conn ceiling the HPA can't relieve)
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        server_tokens off;                       # rec #13: don't leak nginx version

        open_file_cache max=1000 inactive=20s;   # rec #10: cache static fd/metadata
        open_file_cache_valid 30s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'HIGH:!aNULL:!MD5:!3DES';
        ssl_prefer_server_ciphers on;

        set_real_ip_from 0.0.0.0/0;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        map $http_x_forwarded_for $real_client_ip {
            ~^(?<ip>[^,]+) $ip;
            default $remote_addr;
        }

        log_format fail2ban '$real_client_ip - [$time_local] "$request" $status "$http_referer" "$http_user_agent"';

        map $status $loggable {
            ~^[23]  1;
            default 0;
        }
        map $request_method $loggable {
            default 1;
            HEAD 0;
        }
        access_log  /var/log/nginx/access.log  fail2ban;
        access_log /dev/stdout fail2ban;
        sendfile        on;
        tcp_nopush     on;
        tcp_nodelay    on;                       # rec #23: low-latency flush for keep-alive responses
        keepalive_timeout  65;
        gzip  on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
        gzip_min_length 256;
        gzip_comp_level 5;
        gzip_vary on;

        # rec #18: origin rate-limit backstop. Cloudflare is the primary rate limiter;
        # this protects the origin if the tunnel IP leaks. Keyed on the real client IP
        # (the CF-supplied XFF), not the tunnel source, so it limits per visitor.
        limit_req_zone $real_client_ip zone=req_per_ip:10m rate=30r/s;
        limit_conn_zone $real_client_ip zone=conn_per_ip:10m;
        limit_req_status 429;
        limit_conn_status 429;

        # 2026-07-03 blog URL migration: permanent 301s from the old /image/pages/ paths
        # to the flat extensionless /blog/<slug> scheme (source of truth: blog-slug-map.md
        # in Greg's scripts dir). KEEP FOREVER — external backlinks and the search index
        # point at the old paths; the map is O(1) per request and costs nothing.
        map $uri $blog_redirect {
            /image/pages/initial.html /blog/first-post;
            /image/pages/2024/July/GitHub.html /blog/github-basics;
            /image/pages/2024/July/Pi-Hole.html /blog/pi-hole-setup;
            /image/pages/2024/July/LB.html /blog/load-balancers-explained;
            /image/pages/2024/July/DockerHub.html /blog/docker-hub;
            /image/pages/2024/July/VPNs.html /blog/vpns-explained;
            /image/pages/2024/July/thecloud.html /blog/what-is-the-cloud;
            /image/pages/2024/July/wifi.html /blog/how-wifi-works;
            /image/pages/2024/July/homebuild.html /blog/home-network-build;
            /image/pages/2024/Aug/ansible.html /blog/ansible-basics;
            /image/pages/2024/Aug/dmrradios.html /blog/dmr-radios;
            /image/pages/2024/Aug/dockerupdate.html /blog/updating-docker-images;
            /image/pages/2024/Aug/k8s.html /blog/kubernetes-basics;
            /image/pages/2024/Aug/secrets.html /blog/passwords-and-hardware-keys;
            /image/pages/2024/Aug/travelrouter.html /blog/travel-router;
            /image/pages/2024/Aug/tryhackme.html /blog/tryhackme;
            /image/pages/2024/Aug/twingate.html /blog/twingate;
            /image/pages/2024/Sept/classsetup.html /blog/learning-lab-setup;
            /image/pages/2024/Sept/smoketest.html /blog/smoke-testing-my-site;
            /image/pages/2024/Sept/techimplants.html /blog/nfc-implant-biohacking;
            /image/pages/2024/Sept/tools.html /blog/terraform-vs-ansible;
            /image/pages/2024/Sept/upstreamdns.html /blog/upstream-dns;
            /image/pages/2024/Nov/AOC.html /blog/advent-of-cyber;
            /image/pages/2025/June/githubadv.html /blog/github-advanced;
            /image/pages/2025/June/websecurity.html /blog/web-security-basics;
            /image/pages/2025/July/cicd.html /blog/cicd-pipeline;
            /image/pages/2025/July/cron.html /blog/crontab;
            /image/pages/2025/July/homelab.html /blog/homelab-tour;
            /image/pages/2025/Aug/DEFCON.html /blog/defcon;
            /image/pages/2025/Aug/UV.html /blog/uv-python-tool;
            /image/pages/2025/Sept/agenticAI.html /blog/agentic-ai-vs-ai;
            /image/pages/2025/Sept/MCP.html /blog/what-is-mcp;
            /image/pages/2025/Sept/piholeadv.html /blog/pi-hole-advanced;
            /image/pages/2025/Dec/web-blocks.html /blog/blocks-for-the-year;
            /image/pages/2026/Jan/actioncheck.html /blog/actioncheck;
            /image/pages/2026/May/ClaudeBigRepo.html /blog/claude-code-big-repos;
            /image/pages/2026/May/ClaudeSkills.html /blog/claude-agent-building-blocks;
            /image/pages/2026/May/NessusandWazuh.html /blog/nessus-and-wazuh;
            /image/pages/2026/June/AgenticMTTR.html /blog/machine-speed-triage;
            /image/pages/2026/June/AgentSwarmHeal.html /blog/self-healing-agent-swarms;
            /image/pages/2026/June/LetItBake.html /blog/patch-fast-let-it-bake;
            /image/pages/2026/June/TokensDownTheStack.html /blog/knowledge-down-the-stack;
            /image/pages/2026/July/Fable5Weekend.html /blog/fable-5-weekend-projects;
            default "";
        }

        include /etc/nginx/conf.d/status.conf;

        server {
          listen 8080;
          # 2026-07-03 migration hotfix: origin listens on plain :8080 behind the CF
          # tunnel, so nginx's default absolute redirects emitted
          # "Location: http://greg.heffner.live:8080/..." — unreachable from the
          # internet (only 443 via CF). Relative redirects let the browser resolve
          # against https://greg.heffner.live. Applies to all return/dir redirects.
          absolute_redirect off;
          port_in_redirect off;
          # rec #18: apply the origin backstop to all locations. The trivial /healthz
          # probe and Datadog (:8081, separate server) stay well under these; real users
          # behind CF rarely sustain 30 r/s, and the generous burst avoids limiting a
          # legit multi-asset page load.
          limit_req zone=req_per_ip burst=60 nodelay;
          limit_conn conn_per_ip 30;

          # 2026-07-03 blog migration: fire the permanent redirects before any location
          # matching ('if' + 'return' at server level is the one safe if-pattern).
          if ($blog_redirect) {
              return 301 $blog_redirect;
          }
          # rec #14: server-level security headers (CSP intentionally NOT global —
          # the site loads GTM/AdSense/Cookiebot/Clarity/jsdelivr/Google Fonts +
          # inline scripts; a strict CSP would break them. CSP stays image-scoped.)
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-Frame-Options "SAMEORIGIN" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;
          # backlog 2026-07-02: CSP limited to directives that cannot break the ad/
          # analytics stack (script/style/img/frame loading untouched — the full-CSP
          # decision from rec #14 stands). Mirrors XFO, blocks <base> hijack + plugins.
          add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
          add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

          location = /healthz {        # rec #7/#22: cheap liveness endpoint, no disk, no log
              access_log off;
              default_type text/plain;
              return 200 "ok";
          }
          # rec #19: browsers/iOS auto-request these root icons. Serve the REAL binaries from
          # the git-sync checkout (mounted at /content, repo dir images/) — they were 3 base64-text blobs in
          # www-configmap (~32% of it) that actually served broken; now removed. No precomposed
          # file on disk, so alias it to the regular apple-touch-icon.
          location = /favicon.ico {
              alias /content/www/images/favicon.ico;
              access_log off;
              expires 1y;
              add_header Cache-Control "public, max-age=31536000, no-transform";
          }
          location = /apple-touch-icon.png {
              alias /content/www/images/apple-touch-icon.png;
              expires 1y;
              add_header Cache-Control "public, max-age=31536000, no-transform";
          }
          location = /apple-touch-icon-precomposed.png {
              alias /content/www/images/apple-touch-icon.png;
              expires 1y;
              add_header Cache-Control "public, max-age=31536000, no-transform";
          }
          location ~* wlwmanifest\.xml$ { return 444; }
          location ~* xmlrpc\.php { return 444; }
          location = /wp-login.php { deny all; return 444; }
          location ~* ^/(wp-admin|wp-includes) { deny all; return 444; }
          # 2026-07-03 blog migration: posts moved out of /image/pages/ into their own
          # git-sync checkout at /content/www/blog, served flat + extensionless (/blog/<slug>
          # -> blog/<slug>.html via try_files internal rewrite, so mime/gzip still apply).
          # This replaces the 2026-07-03 P1 hotfix regex block — the old /image/pages/
          # URLs now 301 via $blog_redirect before location matching ever runs.
          location = /blog {
              return 301 /blog.html;
          }
          location = /blog/ {
              return 301 /blog.html;
          }
          location ~ ^/blog/(.+)/$ {
              return 301 /blog/$1;   # canonical form has no trailing slash
          }
          location /blog/ {
              root /content/www; # 2026-09-03 (C2): git-sync checkout; root + URI -> /content/www/blog/<slug>
              try_files $uri $uri.html =404;
              # HTML policy — same as location / (headers copied wholesale, no inherit)
              add_header Cache-Control "public, max-age=300, must-revalidate" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
              add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
              add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
          }
          location /image/ {
              alias /content/www/images/; # 2026-09-03 (C2): repo dir is images/ (plural), URL is /image/ (singular), so alias maps one onto the other
              expires 1y;
              add_header Cache-Control "public, max-age=31536000, no-transform";
              add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline';";
              add_header X-Content-Type-Options "nosniff" always;   # rec #14 (add_header doesn't inherit into a location with its own add_header)
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
          }
          # rec #13: removed `ignore_invalid_headers off;` — restore secure default (reject malformed headers)

          location / {
              root /usr/share/nginx/html;
              index index.html index.htm;
              # rec #11: HTML is un-fingerprinted and changes every deploy. Short TTL +
              # must-revalidate so a missed edge purge self-heals fast — instead of
              # inheriting the 1y asset cache, which made the CF purge load-bearing.
              add_header Cache-Control "public, max-age=300, must-revalidate" always;
              add_header X-Content-Type-Options "nosniff" always;   # rec #14 (re-stated: this location sets its own add_header)
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
              add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
              add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
          }
          location = /sitemap.xml {
              default_type application/xml;
              root /usr/share/nginx/html;
          }
          # 2026-07-03: removed dead `location /images/` block — its root+URI append
          # resolved to .../html/images/images/* which never existed (assets live under
          # /image/, singular). It could not serve a file; deleted, not relocated.
        }
    }
  status.conf: |
    server {
      listen 8081;
      location /nginx_status {
        stub_status;
        access_log off;
        # rec #13: :81 is no longer exposed on the public LoadBalancer (dropped from the
        # Service); only reachable in-cluster (Datadog scrapes the pod IP at :8081 directly).
        allow all;
        # server_tokens inherits `off` from http{} (rec #13)
      }
    }
