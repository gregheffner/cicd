apiVersion: v1
kind: Service
metadata:
  labels:
    app: nginx-web
  name: nginx-service
  namespace: prod
spec:
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      port: 80
      targetPort: http
    # rec #13: stub_status (:81 -> targetPort nginx-status/8081) removed from the public
    # LoadBalancer. Datadog scrapes it on the pod IP (:8081) directly, not via the Service.
  selector:
    app: nginx-web
    version: green
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-web-blue
  namespace: prod
spec:
  maxReplicas: 6 # 2 per worker; anti-affinity is preferred so extras can double up under load
  minReplicas: 3
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-web-blue
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization            # was AverageValue "3000m" (vs 100m req -> never scaled); blue now requests 250m
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # rec #16: anti-flap on scale-down
---
# P5: HPA for the green Deployment so green is promotable + autoscaling-symmetric.
# Both colors use Utilization 70% (each nginx container requests cpu: 250m).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-web-green
  namespace: prod
spec:
  maxReplicas: 6 # 2 per worker; anti-affinity is preferred so extras can double up under load
  minReplicas: 3
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-web-green
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # rec #16: anti-flap on scale-down
