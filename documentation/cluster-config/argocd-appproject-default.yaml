apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations: {}
  name: default
  namespace: automation
spec:
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
  - group: kyverno.io
    kind: ClusterPolicy
  - group: scheduling.k8s.io
    kind: PriorityClass
  - group: storage.k8s.io
    kind: StorageClass
  - group: apiregistration.k8s.io
    kind: APIService
  - group: networking.k8s.io
    kind: IngressClass
  - group: policy.kyverno.io
    kind: '*'
  - group: external-secrets.io
    kind: ClusterSecretStore
  - group: external-secrets.io
    kind: ClusterExternalSecret
  description: 'Scoped 2026-09-03 (CIS C10). Was fully open: any repo, any namespace,
    any cluster kind. ArgoCD''s application-controller is effectively cluster-admin,
    so this project IS its blast radius.'
  destinations:
  - namespace: cloudflared
    server: https://kubernetes.default.svc
  - namespace: datadog
    server: https://kubernetes.default.svc
  - namespace: external-secrets
    server: https://kubernetes.default.svc
  - namespace: kube-system
    server: https://kubernetes.default.svc
  - namespace: kyverno
    server: https://kubernetes.default.svc
  - namespace: prod
    server: https://kubernetes.default.svc
  - namespace: radar
    server: https://kubernetes.default.svc
  - namespace: automation
    server: https://kubernetes.default.svc
  - namespace: default
    server: https://kubernetes.default.svc
  - namespace: kube-flannel
    server: https://kubernetes.default.svc
  namespaceResourceBlacklist:
  - group: ''
    kind: ResourceQuota
  - group: ''
    kind: LimitRange
  sourceRepos:
  - https://github.com/gregheffner/cicd
  - https://github.com/gregheffner/cicd.git
  - https://helm.datadoghq.com
  - https://charts.external-secrets.io
  - https://kyverno.github.io/kyverno

