apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: ["RequestReceived"]
rules:
  # ---------- drop pure infrastructure churn (measured: 62% of all events) ----------
  - level: None
    resources:
      - {group: "coordination.k8s.io", resources: ["leases"]}
      - {group: "authorization.k8s.io"}
      - {group: "", resources: ["events", "endpoints"]}
      - {group: "discovery.k8s.io", resources: ["endpointslices"]}
      - {group: "metrics.k8s.io"}
  # ---------- controllers that legitimately hammer secrets: drop their READS, keep writes ----------
  - level: None
    verbs: ["get", "list", "watch"]
    users:
      - system:serviceaccount:external-secrets:external-secrets
      - system:serviceaccount:external-secrets:external-secrets-cert-controller
      - system:serviceaccount:automation:argocd-application-controller
      - system:serviceaccount:automation:argocd-repo-server
      - system:serviceaccount:automation:argocd-server
      - system:serviceaccount:kyverno:kyverno-admission-controller
      - system:serviceaccount:kyverno:kyverno-background-controller
      - system:serviceaccount:kyverno:kyverno-cleanup-controller
      - system:serviceaccount:kyverno:kyverno-reports-controller
      - system:serviceaccount:kube-system:metrics-server
  - level: None
    users: ["system:kube-proxy", "system:apiserver", "system:kube-controller-manager", "system:kube-scheduler"]
    verbs: ["get", "list", "watch"]
  - level: None
    userGroups: ["system:nodes"]
    verbs: ["get", "list", "watch"]
  - level: None
    nonResourceURLs: ["/healthz*", "/livez*", "/readyz*", "/version", "/metrics", "/openapi*"]
  # ---------- signal worth keeping ----------
  # anyone NOT excluded above touching secrets or minting tokens
  - level: Metadata
    resources:
      - {group: "", resources: ["secrets", "configmaps", "serviceaccounts/token"]}
      - {group: "authentication.k8s.io", resources: ["tokenreviews"]}
  # full request+response on security-relevant writes
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
    resources:
      - {group: "rbac.authorization.k8s.io"}
      - {group: "", resources: ["pods", "pods/exec", "pods/attach", "pods/portforward", "serviceaccounts", "namespaces"]}
      - {group: "admissionregistration.k8s.io"}
      - {group: "kyverno.io"}
  # metadata for every other write
  - level: Metadata
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
  # everything else (reads) dropped
  - level: None
