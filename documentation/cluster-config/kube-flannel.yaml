# kube-flannel — CAPTURED FROM THE LIVE CLUSTER, 2026-09-05.
#
# WHY THIS FILE EXISTS
# flannel was deployed by a raw `kubectl apply` of the upstream manifest and was
# NOT in version control anywhere: not in this repo, not an ArgoCD Application,
# not saved on the bastion. The DaemonSet existed only as live cluster state, so
# there was no source of truth to re-apply if it were ever deleted, and any future
# `kubectl apply` of an upstream manifest would silently drop the local changes
# below.
#
# ArgoCD does NOT sync this, by design — same as documentation/cluster-config/ for
# the kubeadm config. It is a source of truth and a diff base, not a live sync.
#
# LOCAL CHANGES THAT UPSTREAM DOES NOT SHIP — preserve these on any bump:
#   1. DaemonSet args carry an explicit interface pin:
#        --iface=ens34   (k8-primary)
#        --iface=eno1    (worker1, worker2, worker3)
#      Without it flanneld auto-detects, and every node also carries
#      100.64.0.10/32 and 10.96.0.10/32 on a `nodelocaldns` dummy interface. If
#      auto-detection ever picked one of those, that node's VXLAN endpoint would be
#      wrong and pod networking would break. flannel v0.28.0 changes the selection
#      logic (#2295), which is what prompted pinning it first, on v0.27.0.
#      Verified after applying: every node still selects the same address as before
#      (k8-primary ens34/192.168.1.190, worker1 eno1/192.168.1.192,
#       worker2 eno1/192.168.1.191, worker3 eno1/192.168.25.222) and a full
#      4x4 cross-node pod ping mesh passed.
#   2. Namespace label `datadoghq.com/ignore: "true"` — keeps Datadog from
#      ingesting this namespace. Upstream does not ship it; losing it costs money
#      silently rather than breaking anything.
#
# Next planned change: image v0.27.0 -> v0.28.9 (own window; not a blocker —
# flannel's floor is k8s v1.17+ with no ceiling).
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    datadoghq.com/ignore: 'true'
    k8s-app: flannel
    kubernetes.io/metadata.name: kube-flannel
    pod-security.kubernetes.io/enforce: privileged
  name: kube-flannel
spec:
  finalizers:
  - kubernetes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    k8s-app: flannel
  name: flannel
  namespace: kube-flannel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    k8s-app: flannel
  name: flannel
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - nodes/status
  verbs:
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    k8s-app: flannel
  name: flannel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flannel
subjects:
- kind: ServiceAccount
  name: flannel
  namespace: kube-flannel
---
apiVersion: v1
data:
  cni-conf.json: "{\n  \"name\": \"cbr0\",\n  \"cniVersion\": \"0.3.1\",\n  \"plugins\"\
    : [\n    {\n      \"type\": \"flannel\",\n      \"delegate\": {\n        \"hairpinMode\"\
    : true,\n        \"isDefaultGateway\": true\n      }\n    },\n    {\n      \"\
    type\": \"portmap\",\n      \"capabilities\": {\n        \"portMappings\": true\n\
    \      }\n    }\n  ]\n}\n"
  net-conf.json: '{
  "Network": "10.244.0.0/16",
  "Backend": {
    "Type": "vxlan"
  },
  "EnableIPv4": true,
  "EnableIPv6": false,
  "EnableNFTables": false
}'
kind: ConfigMap
metadata:
  labels:
    app: flannel
    k8s-app: flannel
    tier: node
  name: kube-flannel-cfg
  namespace: kube-flannel
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: flannel
    k8s-app: flannel
    tier: node
  name: kube-flannel-ds
  namespace: kube-flannel
spec:
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: flannel
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2025-06-26T21:59:30-04:00'
      labels:
        app: flannel
        tier: node
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      containers:
      - args:
        - --ip-masq
        - --kube-subnet-mgr
        - --iface=ens34
        - --iface=eno1
        command:
        - /opt/bin/flanneld
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: EVENT_QUEUE_DEPTH
          value: '5000'
        - name: CONT_WHEN_CACHE_NOT_READY
          value: 'false'
        image: ghcr.io/flannel-io/flannel:v0.28.9
        imagePullPolicy: IfNotPresent
        name: kube-flannel
        resources:
          requests:
            cpu: 100m
            memory: 50Mi
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
          privileged: false
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /run/flannel
          name: run
        - mountPath: /etc/kube-flannel/
          name: flannel-cfg
        - mountPath: /run/xtables.lock
          name: xtables-lock
      dnsPolicy: ClusterFirst
      hostNetwork: true
      initContainers:
      - args:
        - -f
        - /flannel
        - /opt/cni/bin/flannel
        command:
        - cp
        image: ghcr.io/flannel-io/flannel-cni-plugin:v1.9.1-flannel3
        imagePullPolicy: IfNotPresent
        name: install-cni-plugin
        resources: {}
        securityContext:
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /opt/cni/bin
          name: cni-plugin
      - args:
        - -f
        - /etc/kube-flannel/cni-conf.json
        - /etc/cni/net.d/10-flannel.conflist
        command:
        - cp
        image: ghcr.io/flannel-io/flannel:v0.28.9
        imagePullPolicy: IfNotPresent
        name: install-cni
        resources: {}
        securityContext:
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/cni/net.d
          name: cni
        - mountPath: /etc/kube-flannel/
          name: flannel-cfg
      priorityClassName: system-node-critical
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: flannel
      serviceAccountName: flannel
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        operator: Exists
      volumes:
      - hostPath:
          path: /run/flannel
          type: ''
        name: run
      - hostPath:
          path: /opt/cni/bin
          type: ''
        name: cni-plugin
      - hostPath:
          path: /etc/cni/net.d
          type: ''
        name: cni
      - configMap:
          defaultMode: 420
          name: kube-flannel-cfg
        name: flannel-cfg
      - hostPath:
          path: /run/xtables.lock
          type: FileOrCreate
        name: xtables-lock
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
