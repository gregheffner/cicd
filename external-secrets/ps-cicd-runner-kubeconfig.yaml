# external-secrets/ps-cicd-runner-kubeconfig.yaml
# PushSecret (cluster -> 1Password): backs up the runner's complete kubeconfig
# (server + CA + token, mirrored from the Actions runner's kubeconfig on
# K8-Primary into Secret automation/cicd-runner-kubeconfig) to its own vault
# item. Separate op item from cicd-runner-token so the two controllers never
# write one item.
# NOTE: the in-cluster Secret is a manual mirror — recreate it if the file on
# K8-Primary is ever regenerated (e.g. token rotation).
# Path on K8-Primary: /home/gh-runner/.kube/config (uid gh-runner). It moved
# there on 2026-09-03 when the runner was migrated off the `huey` account.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: cicd-runner-kubeconfig
  namespace: automation
spec:
  refreshInterval: 6h
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: cicd-runner-kubeconfig
  deletionPolicy: None
  data:
    - match:
        secretKey: kubeconfig
        remoteRef:
          remoteKey: cicd-runner-kubeconfig
          property: kubeconfig
