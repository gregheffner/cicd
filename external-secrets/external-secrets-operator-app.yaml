# external-secrets/external-secrets-operator-app.yaml  (apply ONCE as cluster-admin to bootstrap)
# Installs External Secrets Operator via its Helm chart (ArgoCD renders server-side, so the
# repo stays raw-YAML — only this Application CR is committed). Sync-wave 0: CRDs+operator
# must exist before the ClusterSecretStore/ExternalSecret CRs (a later wave-1 config app).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: automation
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.10.0         # PINNED — do not float
    helm:
      releaseName: external-secrets
      values: |
        installCRDs: true
        replicaCount: 2             # HA controller
        leaderElect: true          # required when replicaCount > 1
        # 2026-09-13: Datadog autodiscovery for the controller's Prometheus endpoint
        # (:8080, port `metrics`). Applies to the main controller pods only (the chart's
        # top-level podAnnotations); webhook + cert-controller expose nothing worth
        # paying for. Before this, a broken 1Password sync was invisible until a pod
        # failed to start. Allow-list (counters listed without _total; OpenMetrics v2
        # matches on the family name):
        #   externalsecret_status_condition   - THE signal: Ready=0 means a secret is stale
        #   externalsecret_sync_calls         - sync attempts + errors per ExternalSecret
        #   externalsecret_provider_api_calls_count - 1Password Connect call volume/errors
        #   controller_runtime_reconcile_errors     - reconcile failures
        #   workqueue_depth                   - backlog, rises when Connect is down
        podAnnotations:
          ad.datadoghq.com/external-secrets.checks: |
            {
              "openmetrics": {
                "init_config": {},
                "instances": [
                  {
                    "openmetrics_endpoint": "http://%%host%%:8080/metrics",
                    "namespace": "external_secrets",
                    "metrics": [
                      "externalsecret_status_condition",
                      "externalsecret_sync_calls",
                      "externalsecret_provider_api_calls_count",
                      "controller_runtime_reconcile_errors",
                      "workqueue_depth"
                    ]
                  }
                ]
              }
            }
        webhook:
          replicaCount: 2
          # The webhook serves 3 validating webhooks at failurePolicy=Fail
          # (externalsecret-validate, secretstore-validate, clustersecretstore-validate).
          # With 2 replicas and NO PodDisruptionBudget, a node drain could evict both at
          # once and every ExternalSecret/SecretStore/ClusterSecretStore write would be
          # rejected cluster-wide until a replica came back. Required before the k8s
          # 1.32 -> 1.35 upgrade, which drains every node once per hop.
          podDisruptionBudget:
            enabled: true
            minAvailable: 1
        certController:
          replicaCount: 2
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true       # ESO CRDs exceed the client-side-apply annotation limit
