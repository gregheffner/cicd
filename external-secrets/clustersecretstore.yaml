# ClusterSecretStore — how ESO authenticates to 1Password. NO secret values here.
# Auth = the out-of-band Secret external-secrets/onepassword-token (the k8s-eso
# service-account token), which is NOT in git. One store == one vault.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  conditions:
    # `default` removed 2026-10-10: it has no ExternalSecrets/PushSecrets and is not an app namespace
    # (vuln hunt 2026-10-08, Low). Any ExternalSecret created there now fails to bind instead of
    # reading the whole vault. Add a namespace here only when an app actually needs it.
    - namespaces: [cloudflared, prod, datadog, radar, automation, mustangmafia]
  provider:
    onepasswordSDK:
      vault: "k8s-cluster-secrets"
      auth:
        serviceAccountSecretRef:
          name: onepassword-token
          key: token
          namespace: external-secrets
