apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-local-dns
  namespace: kube-system
  labels:
    k8s-app: node-local-dns
    kubernetes.io/cluster-service: "true"
    addonmanager.kubernetes.io/mode: Reconcile
spec:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      k8s-app: node-local-dns
  template:
    metadata:
      labels:
        k8s-app: node-local-dns
      annotations:
        prometheus.io/port: "9253"
        prometheus.io/scrape: "true"
        ad.datadoghq.com/node-cache.checks: |
          {"coredns": {"init_config": {}, "instances": [{"prometheus_url": "http://%%host%%:9253/metrics", "tags": ["dns-role:nodelocal", "dns-node:%%host%%"]}]}}
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: node-local-dns
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: "Exists"
        - effect: "NoExecute"
          operator: "Exists"
        - effect: "NoSchedule"
          operator: "Exists"
      containers:
        - name: node-cache
          image: registry.k8s.io/dns/k8s-dns-node-cache:1.26.4
          # 2026-09-26 sizing, from live usage across all four nodes
          # (24Mi / 54Mi / 54Mi / 55Mi; cpu 4-16m):
          #
          # - memory REQUEST 5Mi -> 64Mi. The old request was 5-11x BELOW actual
          #   usage, which makes this pod a prime eviction candidate under node
          #   memory pressure. Evicting the node's DNS cache is exactly the
          #   failure you do not want, so the request now reflects reality.
          # - memory LIMIT 256Mi (~4.6x the 55Mi peak) and NOT the ~2x used
          #   elsewhere. This is DNS: an OOMKill here is worse than the runaway a
          #   tight limit would contain, so the headroom is deliberate.
          # - NO cpu limit. CPU throttling on a DNS cache shows up as latency on
          #   every lookup on the node. The cpu REQUEST is what matters and is
          #   already generous at 25m vs 4-16m observed.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          args:
            - "-localip"
            - "100.64.0.10,10.96.0.10"
            - "-conf"
            - "/etc/Corefile"
            - "-upstreamsvc"
            - "kube-dns-upstream"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          ports:
            - containerPort: 53
              name: dns
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
            - containerPort: 9253
              name: metrics
              protocol: TCP
          livenessProbe:
            httpGet:
              host: 100.64.0.10
              path: /health
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /run/xtables.lock
              name: xtables-lock
              readOnly: false
            - name: config-volume
              mountPath: /etc/coredns
            - name: kube-dns-config
              mountPath: /etc/kube-dns
      volumes:
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
        - name: kube-dns-config
          configMap:
            name: kube-dns
            optional: true
        - name: config-volume
          configMap:
            name: node-local-dns
            items:
              - key: Corefile
                path: Corefile.base
