apiVersion: v1
kind: ConfigMap
metadata:
  name: node-local-dns
  namespace: kube-system
  labels:
    addonmanager.kubernetes.io/mode: Reconcile
data:
  Corefile: |
    cluster.local:53 {
        errors
        cache {
            success 9984 30
            denial 9984 5
        }
        reload
        loop
        bind 100.64.0.10 10.96.0.10
        forward . __PILLAR__CLUSTER__DNS__ {
            force_tcp
        }
        prometheus :9253
        health 100.64.0.10:8080
    }
    in-addr.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind 100.64.0.10 10.96.0.10
        forward . __PILLAR__CLUSTER__DNS__ {
            force_tcp
        }
        prometheus :9253
    }
    ip6.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind 100.64.0.10 10.96.0.10
        forward . __PILLAR__CLUSTER__DNS__ {
            force_tcp
        }
        prometheus :9253
    }
    tier0.local:53 {
        errors
        cache 30
        reload
        bind 100.64.0.10 10.96.0.10
        forward . 192.168.1.53
    }
    tier0:53 {
        errors
        cache 30
        reload
        bind 100.64.0.10 10.96.0.10
        forward . 192.168.1.53
    }
    .:53 {
        errors
        cache 30
        reload
        loop
        bind 100.64.0.10 10.96.0.10
        forward . tls://76.76.2.22 tls://76.76.10.22 {
            tls_servername 13wz7snbioq.dns.controld.com
            health_check 10s
            max_concurrent 1000
        }
        prometheus :9253
    }
