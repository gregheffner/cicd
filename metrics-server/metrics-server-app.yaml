# metrics-server/metrics-server-app.yaml - created by the root app (argocd/root.yaml).
# Was a raw kubectl apply of upstream v0.9.0 plus one live-only arg; adopted 2026-09-27.
# MANUAL sync for the first (adoption) sync, which only writes tracking annotations;
# automated comes in a follow-up once that is verified.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: automation
spec:
  project: default
  source:
    repoURL: https://github.com/gregheffner/cicd
    targetRevision: HEAD
    path: metrics-server/install
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
