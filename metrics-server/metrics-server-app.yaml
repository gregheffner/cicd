# metrics-server/metrics-server-app.yaml - created by the root app (argocd/root.yaml).
# Was a raw kubectl apply of upstream v0.9.0 plus one live-only arg; adopted 2026-09-27.
# Adoption sync 2026-09-27 was manual and verified (same pods, 0 restarts). Automated with
# selfHeal; prune OFF because it owns cluster-scoped RBAC and an APIService.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: automation
spec:
  project: default
  source:
    repoURL: https://github.com/gregheffner/cicd
    targetRevision: HEAD
    path: metrics-server/install
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
