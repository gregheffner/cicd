# kubelet-csr-approver/kubelet-csr-approver-app.yaml - created by the root app.
# CIS B2 (2026-09-02): approves kubelet SERVING cert requests, so the apiserver and
# metrics-server (--kubelet-certificate-authority) can verify kubelets against the CA.
# Was `helm install` by hand; adopted 2026-09-27. Argo CD renders the chart itself, so the
# old Helm release record (sh.helm.release.v1.kubelet-csr-approver.* in kube-system) is
# stale: NEVER `helm upgrade` or `helm uninstall` it - that would overwrite or delete
# resources Argo CD now owns.
# The chart's test Job (helm.sh/hook: test) is a hook type Argo CD has no mapping for, so it
# is never created.
# Adoption sync 2026-09-27 was manual and verified (same pods, 0 restarts, test Job not
# created). Automated with selfHeal; prune OFF because it owns cluster-scoped RBAC.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubelet-csr-approver
  namespace: automation
spec:
  project: default
  source:
    repoURL: https://postfinance.github.io/kubelet-csr-approver
    chart: kubelet-csr-approver
    targetRevision: 1.2.15
    helm:
      releaseName: kubelet-csr-approver
      valuesObject:
        # bypassDnsResolution is REQUIRED: node names (k8-primary, worker1-3) do not resolve
        # in-cluster (NXDOMAIN), so the default DNS check would deny every CSR.
        bypassDnsResolution: true
        # Only these node names may request a serving cert.
        providerRegex: "^(k8-primary|worker[1-3])$"
        # SAN IPs must fall in one of these. worker3 is on a DIFFERENT subnet (Wheeler).
        providerIpPrefixes:
          - 192.168.1.0/24
          - 192.168.25.0/24
        # MUST stay a string: Helm renders a bare int as 3.16224e+07 and the flag parser rejects it.
        maxExpirationSeconds: "31622400"
        replicas: 2
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
