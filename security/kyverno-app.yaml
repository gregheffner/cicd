# security/kyverno-app.yaml
# Installs Kyverno via Helm as a NEW ArgoCD Application. sync-wave 0 so the
# controller + CRDs are Ready BEFORE the ClusterPolicy (wave 1) — no selfHeal flap.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: automation                 # ArgoCD lives here (same as heffner-prod/dr/shared-services)
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    # ⚠️ TRIPWIRE - READ BEFORE CHANGING targetRevision ⚠️
    # 2026-09-26: kubectl now warns on every apply that the WHOLE
    # `ClusterPolicy` (kyverno.io) kind is deprecated and will be removed,
    # in favour of ValidatingPolicy / MutatingPolicy / GeneratingPolicy /
    # ImageValidatingPolicy under `policies.kyverno.io` (CEL-based).
    # Those CRDs are already installed on this cluster; we use none of them.
    #
    # All FOUR of our policies are kyverno.io/v1 ClusterPolicy:
    #   verify-technotuba-nginx, require-resource-limits,
    #   disallow-latest-tag, restrict-automount-sa-token
    #
    # Nothing is broken today - it is deprecated, not removed - and pinning
    # here is what keeps it that way. But if a future chart DROPS the old
    # API, those four vanish on sync and the cosign image gate on prod stops
    # enforcing. ArgoCD would go OutOfSync so it is not silent, but the
    # control would already be off.
    #
    # BEFORE bumping this: check the release notes for removal of
    # kyverno.io/v1, and if it is gone, migrate the four policies FIRST.
    # The three audit ones are simple pattern matches and port easily; the
    # keyless-cosign signing policy is the fiddly one.
    targetRevision: 3.9.0               # app v1.19.0 (2026-08-20). RE-CONFIRM via the live-confirmations before applying.
    helm:
      values: |
        admissionController:
          replicas: 3                    # HA across the 3 amd64 workers
          # 2026-09-16: Datadog `kyverno` INTEGRATION check (was a generic openmetrics
          # annotation with a 6-metric allow-list added 2026-09-13). The integration's
          # metrics are not billed as custom metrics, so the allow-list bought nothing,
          # and its raw names (kyverno.kyverno_*) left the Kyverno integration dashboard
          # empty. The check maps names itself (kyverno.admission.requests.count etc,
          # incl. the policy_rule_info_total gauge trap). Same annotation on all four
          # controllers; the admission container is `kyverno`, the others `controller`.
          podAnnotations:
            ad.datadoghq.com/kyverno.checks: |
              {"kyverno": {"init_config": {}, "instances": [{"openmetrics_endpoint": "http://%%host%%:8000/metrics"}]}}
        backgroundController:
          podAnnotations:
            ad.datadoghq.com/controller.checks: |
              {"kyverno": {"init_config": {}, "instances": [{"openmetrics_endpoint": "http://%%host%%:8000/metrics"}]}}
        reportsController:
          podAnnotations:
            ad.datadoghq.com/controller.checks: |
              {"kyverno": {"init_config": {}, "instances": [{"openmetrics_endpoint": "http://%%host%%:8000/metrics"}]}}
        cleanupController:
          podAnnotations:
            ad.datadoghq.com/controller.checks: |
              {"kyverno": {"init_config": {}, "instances": [{"openmetrics_endpoint": "http://%%host%%:8000/metrics"}]}}
        # --- verification-result caching (load-bearing once failurePolicy: Fail is on) ---
        # Caches successful image-verification results so a cold Sigstore/egress outage
        # only rejects FRESH (cold-cache) nginx pods, never already-verified digests.
        features:
          imageVerifyCache:
            enabled: true
            maxSize: 1000
            ttl: 60m
          logging:
            format: json # 2026-07-03 Datadog audit: default text format emits ANSI color codes — unparseable in DD Log Explorer and TRC lines mislabeled as errors; json gives structured logs + correct severity
        # --- CNI must never be gated by this webhook ---------------------------
        # 2026-09-19: kube-flannel MUST be exempt from the resource webhook.
        # Deleting a CNI pod is otherwise SELF-TRAPPING: the DaemonSet's replacement
        # pod CREATE goes through this webhook, the API server reaches Kyverno over
        # the pod network, and that network is exactly what the deleted pod provides.
        # A routine post-reboot cleanup (`kubectl delete pod -n kube-flannel --all`)
        # therefore took prod down for ~20 min: every pod create/delete outside
        # kube-system/kyverno returned 504, including the creates needed to restore
        # flannel. Recovery required scaling admissionController to 0, which makes
        # Kyverno delete its own resource webhook on shutdown. Patching failurePolicy
        # to Ignore does NOT work - the webhook-controller reverts it immediately.
        #
        # kube-system is the chart default and MUST be repeated here: setting this
        # value replaces the default list rather than appending to it. The kyverno
        # namespace is still excluded separately by excludeKyvernoNamespace: true.
        config:
          webhooks:
            namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: NotIn
                  values:
                    - kube-system
                    - kube-flannel
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  # 2026-07-03: chart 3.8.1 BUG — the policies.kyverno.io CRD templates hardcode
  # `metadata.annotations: {}` / `labels: {}` (they ignore crds.annotations /
  # crds.customLabels, unlike the kyverno.io group), and ServerSideApply cannot
  # materialize an empty map on a live object — so those 11 CRDs sat permanently
  # OutOfSync on a diff that can never converge (confirmed via ArgoCD UI diff:
  # the ONLY drift is these two metadata fields). Ignore exactly those fields.
  # Deliberately NOT setting RespectIgnoreDifferences — syncs still apply full
  # manifests, so CRD spec upgrades on chart bumps are unaffected.
  # Revisit on chart upgrades: if upstream fixes the templates, drop this block.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
  syncPolicy:
    automated:
      selfHeal: true
      prune: false                       # don't let a transient parse error prune the controller
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true             # Kyverno CRDs are large; SSA avoids last-applied annotation bloat
