# security/disallow-latest-tag.yaml
# AUDIT ONLY. Reports images using :latest or no tag at all.
#
# WHY NOT PSA: PodSecurity does not look at image references. Additive.
#
# BASELINE 2026-09-19: the only offenders were 6 cloudflared pods on
# cloudflare/cloudflared:latest. That is an ACCEPTED RISK (Greg, 2026-09-19) and
# the cloudflared namespace is excluded below, so this policy is expected to
# report ZERO findings. Everything else in the cluster is already tag- or
# digest-pinned. A new finding here therefore means a genuine regression.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/description: >-
      Audit-only. Flags containers using the :latest tag or an untagged image.
spec:
  background: true
  rules:
    - name: require-explicit-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              # cloudflared: ACCEPTED RISK, Greg 2026-09-19. It tracks
              # cloudflare/cloudflared:latest deliberately and will not be pinned.
              # Excluded so this policy's reports stay signal - it remains in force
              # as a regression guard for every OTHER workload.
              namespaces: [kube-system, kube-node-lease, kube-public, cloudflared]
      validate:
        failureAction: Audit
        message: "Image must carry an explicit tag or digest (':latest' and untagged are not reproducible)."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
    - name: require-tag-present
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              # cloudflared: ACCEPTED RISK, Greg 2026-09-19. It tracks
              # cloudflare/cloudflared:latest deliberately and will not be pinned.
              # Excluded so this policy's reports stay signal - it remains in force
              # as a regression guard for every OTHER workload.
              namespaces: [kube-system, kube-node-lease, kube-public, cloudflared]
      validate:
        failureAction: Audit
        message: "Image reference has no tag at all; it will silently resolve to :latest."
        pattern:
          spec:
            containers:
              - image: "*:*"
