# security/restrict-automount-sa-token.yaml
# AUDIT ONLY. Reports pods that mount a ServiceAccount token they may not need.
#
# WHY NOT PSA: PodSecurity has no opinion on ServiceAccount tokens. Additive.
#
# WHY IT MATTERS HERE: the pod network is flat (flannel has no NetworkPolicy
# engine - see the 2026-09-19 playbook), so a mounted SA token plus reachable
# kube-apiserver is a direct escalation path from any compromised pod.
# Removing the token where it is not needed shrinks that path without touching
# the network at all - which is why this ships BEFORE any NetworkPolicy work.
#
# BASELINE 2026-09-19: 42 of 62 pods automount. Many legitimately need it
# (ArgoCD controllers, ESO, Datadog cluster agent, kyverno). The point of Audit
# is to separate those from the ones that just never set the field.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-automount-sa-token
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    policies.kyverno.io/description: >-
      Audit-only. Flags pods with automountServiceAccountToken unset or true.
spec:
  background: true
  rules:
    - name: no-automount-sa-token
      # RE-SCOPED 2026-09-19 after the first Audit pass. Cluster-wide, this policy
      # had almost no yield: 16 of 17 failing workloads were controllers whose
      # ServiceAccount has real RBAC bound (every ArgoCD controller, all Datadog
      # components, all four Kyverno controllers, flannel, ESO + cert-controller),
      # so they legitimately need the token. The single exception,
      # external-secrets-webhook, is upstream-chart-managed.
      #
      # Scoped to the WORKLOAD namespaces instead, where a mounted token is a real
      # finding rather than a design requirement. Platform namespaces are covered by
      # RBAC review, not by this policy.
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [prod, radar, default]
      validate:
        failureAction: Audit
        message: >-
          Pod should set automountServiceAccountToken: false unless it calls the
          Kubernetes API. Flat pod network makes a stray token an escalation path.
        pattern:
          spec:
            automountServiceAccountToken: "false"
