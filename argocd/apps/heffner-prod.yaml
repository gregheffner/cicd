# argocd/apps/heffner-prod.yaml - the BLUE prod nginx (path prod/). Created in the UI;
# written down 2026-09-27 from the live spec when the root app took over Applications.
# Lives here, not in prod/: that directory source has no include filter, so a file there
# would be adopted by this app itself (prune=true).
# sync-options Prune=false: the live object carried an inert `Prune=true` (no parent app
# existed). Under the root app, Prune=false is the one that matters.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: heffner-prod
  namespace: automation
  labels:
    ACTIVE: "TRUE"
    app.kubernetes.io/managed-by: argocd
    owner: gregheffner
    self-heal: "true"
    source: cicd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: default
  source:
    repoURL: https://github.com/gregheffner/cicd
    targetRevision: HEAD
    path: prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
