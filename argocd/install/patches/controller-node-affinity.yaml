# Prefer the home-site workers for the application controller. worker3 sits at the Wheeler
# house behind the site-to-site VPN, so every tunnel or Wheeler WAN blip took Argo CD's only
# controller replica with it (2026-10-09: worker3 NotReady 20:08-20:10 with the controller on it).
# Preferred, not required: if worker1 and worker2 are both down the pod may still run on
# worker3. IgnoredDuringExecution means it does NOT move back on its own once they return;
# it moves at the next reschedule (pod delete, node drain, Saturday patch reboot).
# Merges with upstream's podAntiAffinity, which is left untouched.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [worker1, worker2]
