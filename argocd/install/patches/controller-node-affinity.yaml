# Keep the application controller on the home-site workers. worker3 sits at the Wheeler house
# behind the site-to-site VPN, so every tunnel or Wheeler WAN blip took Argo CD's only
# controller replica with it (2026-10-09: worker3 NotReady 20:08-20:10 with the controller on it).
# Required, not preferred: if worker1 and worker2 are both down the pod stays Pending rather
# than landing on worker3. Merges with upstream's podAntiAffinity, which is left untouched.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [worker1, worker2]
