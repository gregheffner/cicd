apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: radar
  template:
    metadata:
      labels:
        app: radar
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: radar
              topologyKey: kubernetes.io/hostname
      containers:
        - name: radar
          image: technotuba/radar@sha256:31bec3460376c64cd8cbcf7124c63afd57f5624f01321308ba128b0086c969fd
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - secretRef:
                name: radar
---
apiVersion: v1
kind: Service
metadata:
  name: radar
spec:
  selector:
    app: radar
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: radar
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: radar
