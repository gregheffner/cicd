apiVersion: v1
kind: ServiceAccount
metadata:
  name: radar
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radar
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: radar
  template:
    metadata:
      labels:
        app: radar
    spec:
      # 2026-09-03 (CIS C1): dedicated ServiceAccount, no API token, restricted-profile
      # securityContext, read-only root with a scratch /tmp, and resource limits.
      # Facts this is built on: the image runs as uid 1000 (node), writes nothing
      # outside /tmp, holds zero capabilities, and uses ~1m CPU / ~30Mi per pod.
      serviceAccountName: radar
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: radar
              topologyKey: kubernetes.io/hostname
      containers:
        - name: radar
          image: technotuba/radar@sha256:7c7a08f867304b277857da29a44e9e0e548bde53eeed999c1d70ce0e20d72e66
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - secretRef:
                name: radar
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: radar
spec:
  selector:
    app: radar
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: radar
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: radar
