# datadog/datadog-agent.yaml
# The DatadogAgent CR — full, explicit reproduction of the spec currently running in
# the `default` namespace (captured live before migration). This is now the single
# source of truth for agent features; do NOT kubectl edit it — change it here.
#
# The API key is supplied OUT OF BAND: Secret `datadog-secret` (key `api-key`) must
# exist in the `datadog` namespace before this syncs. It is NOT stored in this repo.
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    clusterName: heffner.k8s
    site: us5.datadoghq.com
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
    tags:
      - env:prod
    kubelet:
      # 2026-09-02 (CIS B2): kubelet serving certs are now issued by the cluster CA
      # (serverTLSBootstrap + kubelet-csr-approver) instead of being self-signed and
      # expired, so verification can be turned back on. The agent verifies against the
      # service-account CA bundle it already mounts. This also removes the cause of the
      # old "TLS handshake error ... bad certificate" journal spam rather than hiding it.
      tlsVerify: true
  features:
    apm:
      instrumentation:
        enabled: false # 2026-07-03 audit: nothing in the cluster runs dotnet/java/js/php/python — auto-instrumentation was a paid feature instrumenting nothing
    asm:
      threats:
        enabled: true
    cws:
      enabled: true
    logCollection:
      enabled: true
      containerCollectAll: true
    npm:
      enabled: true
    orchestratorExplorer:
      enabled: true
    otelCollector:
      enabled: true
      ports:
        - name: otel-grpc
          containerPort: 4317
          hostPort: 4317
          protocol: TCP
        - name: otel-http
          containerPort: 4318
          hostPort: 4318
          protocol: TCP
    prometheusScrape:
      enabled: true
      enableServiceEndpoints: true
      additionalConfigs: |-
        - autodiscovery:
            kubernetes_services:
              - automation/argocd-metrics
          configurations:
            - openmetrics_endpoint: "http://argocd-metrics.automation.svc.cluster.local:8082/metrics"
              namespace: "argocd"
              metrics:
                - ".*"
    usm:
      enabled: true
  override:
    # Pinned in lockstep with nodeAgent. Previously unset, so the operator chose the
    # cluster agent version independently of the node agents - the cause of the skew.
    clusterAgent:
      image:
        name: gcr.io/datadoghq/cluster-agent:7.82.3
        pullPolicy: IfNotPresent
    nodeAgent:
      annotations:
        # agent + process-agent ptrace-read host processes for live process collection;
        # containerd's default profile (cri-containerd.apparmor.d) denies it, flooding the
        # kernel audit log (~1 DENIED line every 2s per node). The operator already sets
        # system-probe unconfined the same way.
        container.apparmor.security.beta.kubernetes.io/agent: unconfined
        container.apparmor.security.beta.kubernetes.io/process-agent: unconfined
      image:
        # 2026-09-02: pinned. Was `latest-full` + pullPolicy Always, which silently
        # rolled the node agents to 7.82.3 during an unrelated restart while the
        # cluster agent stayed on the operator default (7.64.3). An 18-version skew
        # broke the orchestrator node-UID lookup (404) and is unsupported: Datadog
        # requires the cluster agent to be >= the node agents.
        name: gcr.io/datadoghq/agent:7.82.3-full
        pullPolicy: IfNotPresent
      containers:
        agent:
          env:
            - name: DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED
              value: "true"
            - name: DD_PROCESS_AGENT_ENABLED
              value: "true"
            - name: DD_KUBELET_TLS_VERIFY
              value: "true"
            # 2026-07-03 audit: removed DD_CONTAINER_INCLUDE=name:heffner.live — matched
            # no actual container name (they're nginx/fail2ban/...); dead config that read
            # as if discovery were filtered when it wasn't (include without exclude is a no-op)
        otel-agent:
          env:
            - name: DD_OTELCOLLECTOR_ENABLED
              value: "true"
        system-probe:
          env:
            # Network Path (CNM). Traceroute-style hop-by-hop monitoring of the paths this
            # cluster actually uses outbound — Cloudflare edge, DNS, upstream — so a latency
            # regression can be attributed to a specific hop instead of guessed at.
            #
            # Set here rather than under .spec.features because operator 1.14.0's v2alpha1
            # CRD exposes no `networkPath` feature field (verified against the live CRD).
            # Requires agent 7.55+ (running 7.82.3) and npm.enabled, both already true.
            - name: DD_NETWORK_PATH_CONNECTIONS_MONITORING_ENABLED
              value: "true"
      tolerations:                        # run on the control-plane node too (4/4 nodes)
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
