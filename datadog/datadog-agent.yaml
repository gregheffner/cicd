# datadog/datadog-agent.yaml
# The DatadogAgent CR — full, explicit reproduction of the spec currently running in
# the `default` namespace (captured live before migration). This is now the single
# source of truth for agent features; do NOT kubectl edit it — change it here.
#
# The API key is supplied OUT OF BAND: Secret `datadog-secret` (key `api-key`) must
# exist in the `datadog` namespace before this syncs. It is NOT stored in this repo.
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
  namespace: datadog
spec:
  global:
    clusterName: heffner.k8s
    site: us5.datadoghq.com
    credentials:
      apiSecret:
        secretName: datadog-secret
        keyName: api-key
    tags:
      - env:prod
    kubelet:
      # 2026-09-02 (CIS B2): kubelet serving certs are now issued by the cluster CA
      # (serverTLSBootstrap + kubelet-csr-approver) instead of being self-signed and
      # expired, so verification can be turned back on. The agent verifies against the
      # service-account CA bundle it already mounts. This also removes the cause of the
      # old "TLS handshake error ... bad certificate" journal spam rather than hiding it.
      tlsVerify: true
  features:
    apm:
      # 2026-09-19 lockdown: APM stays ENABLED - USM rides the trace agent, and the nginx
      # availability SLO is built on universal.http.server. Only the HOST PORT goes away:
      # tcp/8126 was reachable from the whole LAN on every node and nothing off-node sends
      # traces, so anyone could inject spans. In-cluster senders use /var/run/datadog/apm.socket.
      hostPortConfig:
        enabled: false
      instrumentation:
        enabled: false # 2026-07-03 audit: nothing in the cluster runs dotnet/java/js/php/python — auto-instrumentation was a paid feature instrumenting nothing
    asm:
      threats:
        enabled: true
    cws:
      enabled: true
    logCollection:
      enabled: true
      containerCollectAll: true
    # 2026-09-19 lockdown: udp/8125 was bound to 0.0.0.0 on every node via
    # DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true, so anything on the LAN could inject custom metrics.
    # Local senders are unaffected: /usr/local/bin/egress-check.sh targets 127.0.0.1:8125 and
    # the agent runs hostNetwork, and in-cluster senders use /var/run/datadog/dsd.socket.
    dogstatsd:
      nonLocalTraffic: false
    npm:
      enabled: true
    orchestratorExplorer:
      enabled: true
    # 2026-09-19 lockdown: OFF. tcp/4317 and tcp/4318 were open to the LAN on every node and
    # accepted unauthenticated OTLP. Nothing sends OTLP: no otel.* metric family reports, and no
    # workload sets OTEL_EXPORTER_*. Re-enable with hostPort omitted if OTLP is ever adopted.
    otelCollector:
      enabled: false
    # 2026-09-16: prometheusScrape OFF. It auto-scraped every prometheus.io-annotated
    # target (node-local-dns, kube-dns, kubelet-csr-approver, argocd-metrics) and
    # shipped ~250 UN-NAMESPACED metric families (go_*, coredns_*, argocd_*,
    # workqueue_*, controller_runtime_*) as billed custom metrics, all duplicates of
    # the coredns (nodelocaldns annotation) and argocd (cluster check) integrations.
    prometheusScrape:
      enabled: false
    usm:
      enabled: true
    # 2026-09-14: etcd is collected as a CLUSTER check (one scrape, one host tag) pointed at
    # the plain-HTTP metrics listener kubeadm-config now exposes on the node IP (:2381).
    # The agent's bundled etcd auto_conf targets :2379 (TLS client port, no certs) and had
    # failed silently since the 09-06 kubeadm upgrade - etcd metrics were dead for 9 days
    # and the [etcd] no-leader monitor sat in No Data.
    clusterChecks:
      enabled: true
      useClusterChecksRunners: false
  override:
    # Pinned in lockstep with nodeAgent. Previously unset, so the operator chose the
    # cluster agent version independently of the node agents - the cause of the skew.
    clusterAgent:
      extraConfd:
        configDataMap:
          etcd.yaml: |-
            cluster_check: true
            init_config:
            instances:
              - prometheus_url: http://100.100.0.8:2381/metrics
                tags:
                  - kube_cluster_name:heffner.k8s
                  - etcd_role:control-plane
          argocd.yaml: |-
            cluster_check: true
            init_config:
            instances:
              - app_controller_endpoint: http://argocd-metrics.automation.svc.cluster.local:8082/metrics
                api_server_endpoint: http://argocd-server-metrics.automation.svc.cluster.local:8083/metrics
                repo_server_endpoint: http://argocd-repo-server.automation.svc.cluster.local:8084/metrics
                applicationset_controller_endpoint: http://argocd-applicationset-controller-metrics.automation.svc.cluster.local:8080/metrics
                notifications_controller_endpoint: http://argocd-notifications-controller-metrics.automation.svc.cluster.local:9001/metrics
                tags:
                  - kube_cluster_name:heffner.k8s
      # 2026-09-16: esxi cluster check. conf.yaml carries a password so it is NOT in
      # extraConfd (a ConfigMap); ESO renders it into Secret datadog/datadog-esxi
      # (external-secrets/es-datadog-esxi.yaml) and it is mounted as conf.d/esxi.d/.
      volumes:
        - name: esxi-conf
          secret:
            secretName: datadog-esxi
      containers:
        cluster-agent:
          volumeMounts:
            - name: esxi-conf
              mountPath: /etc/datadog-agent/conf.d/esxi.d
              readOnly: true
      image:
        name: gcr.io/datadoghq/cluster-agent:7.82.3
        pullPolicy: IfNotPresent
    nodeAgent:
      extraConfd:
        configDataMap:
          # 2026-09-18: DNS was the one SPOF with no monitoring at all. Pi-hole is the
          # house resolver, node-local-dns + CoreDNS forward to ControlD over DoT, and
          # nothing would have told us any of them stopped answering. Runs on every node
          # (hostNetwork), so a per-node failure is attributable - worth it for worker3,
          # which sits at the remote site and reaches Pi-hole over the S2S tunnel.
          # Baselines measured 2026-09-18 before shipping: pihole 0-450ms, node-local
          # external 122-138ms (DoT handshake to ControlD), cluster names 3-5ms, UDM 1-79ms.
          # resolves_as is only used where the answer is stable: Cloudflare rotates the
          # public A records for greg.heffner.live, so that one is never asserted.
          dns_check.yaml: |-
            init_config:
            instances:
              # Every hostname below is ABSOLUTE (trailing dot). The agent runs
              # hostNetwork but still gets the pod resolv.conf: ndots:5 plus four
              # cluster.local search domains. Without the dot, dnspython tries
              # greg.heffner.live.<each search domain> FIRST and only then the real
              # name. Pi-hole does not answer *.cluster.local at all (it drops the
              # query rather than returning NXDOMAIN), so both Pi-hole instances
              # burned the whole 5s lifetime on search attempts and never reached
              # the real lookup. The other resolvers NXDOMAIN'd fast enough to
              # survive, but paid 4 extra round trips: 113ms -> 1ms on node-local,
              # 197ms -> 37ms on 1.1.1.1. Do not remove the trailing dots.
              # house resolver, external name: Pi-hole -> unbound/upstream
              - hostname: greg.heffner.live.
                nameserver: 192.168.1.53
                timeout: 5
                min_collection_interval: 60
                tags:
                  - dns_path:pihole
                  - dns_scope:external
              # house resolver, local record: also proves the mesh A records survive
              - hostname: wazuh.tier0.local.
                nameserver: 192.168.1.53
                resolves_as: 100.100.0.10
                timeout: 5
                min_collection_interval: 60
                tags:
                  - dns_path:pihole
                  - dns_scope:local-record
              # cluster fast path, external name: node-local-dns -> CoreDNS -> DoT -> ControlD
              - hostname: greg.heffner.live.
                nameserver: 100.64.0.10
                timeout: 5
                min_collection_interval: 60
                tags:
                  - dns_path:node-local-dns
                  - dns_scope:external
              # cluster fast path, cluster name
              - hostname: kubernetes.default.svc.cluster.local.
                nameserver: 100.64.0.10
                resolves_as: 10.96.0.1
                timeout: 5
                min_collection_interval: 60
                tags:
                  - dns_path:node-local-dns
                  - dns_scope:cluster
              # CoreDNS service directly, so a node-local-dns fault is distinguishable
              - hostname: kubernetes.default.svc.cluster.local.
                nameserver: 10.96.0.10
                resolves_as: 10.96.0.1
                timeout: 5
                min_collection_interval: 60
                tags:
                  - dns_path:coredns
                  - dns_scope:cluster
              # the gateway's own resolver (ControlD over DoH3)
              - hostname: greg.heffner.live.
                nameserver: 192.168.1.1
                timeout: 5
                min_collection_interval: 60
                tags:
                  - dns_path:udm-controld
                  - dns_scope:external
              # control: if this fails too, the internet is broken, not our DNS
              - hostname: greg.heffner.live.
                nameserver: 1.1.1.1
                timeout: 5
                min_collection_interval: 60
                tags:
                  - dns_path:cloudflare-control
                  - dns_scope:external
      # 2026-09-16: host network so the agent can reach kube-scheduler (:10259) and
      # kube-controller-manager (:10257), which kubeadm binds to 127.0.0.1 (CIS 1.3.7
      # / 1.4.2, kept). The stock kube_scheduler / kube_controller_manager auto-conf
      # tries https://localhost:<port> and lights up on the control plane by itself.
      # ClusterFirstWithHostNet is load-bearing: without it a host-network pod uses
      # the node resolver and cannot find the cluster agent service (all cluster
      # checks would go dark).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      annotations:
        # The agent ptrace-reads host processes for live process collection; containerd's
        # default profile (cri-containerd.apparmor.d) denies it, flooding the kernel audit
        # log (~1 DENIED line every 2s per node). The operator already sets system-probe
        # unconfined the same way.
        #
        # 2026-09-02: the process-agent annotation was dropped. Operator 1.29.0 sets
        # DD_PROCESS_CONFIG_RUN_IN_CORE_AGENT_ENABLED, so there is no separate
        # process-agent container any more (pods went 6/6 -> 5/5) and the annotation
        # named a container that no longer exists. The agent one matters MORE now, not
        # less, because the ptrace work moved into the core agent.
        container.apparmor.security.beta.kubernetes.io/agent: unconfined
      image:
        # 2026-09-02: pinned. Was `latest-full` + pullPolicy Always, which silently
        # rolled the node agents to 7.82.3 during an unrelated restart while the
        # cluster agent stayed on the operator default (7.64.3). An 18-version skew
        # broke the orchestrator node-UID lookup (404) and is unsupported: Datadog
        # requires the cluster agent to be >= the node agents.
        name: gcr.io/datadoghq/agent:7.82.3-full
        pullPolicy: IfNotPresent
      containers:
        agent:
          env:
            # DD_PROCESS_AGENT_ENABLED (process_config.enabled) was removed 2026-09-02:
            # the agent logs it as deprecated in favour of process_config.process_collection
            # and process_config.container_collection. process_collection is set right here;
            # container_collection and process_discovery are supplied by the operator. So
            # this removal changes no behaviour, it just stops the deprecation warning.
            - name: DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED
              value: "true"
            - name: DD_KUBELET_TLS_VERIFY
              value: "true"
            # 2026-09-14: the bundled etcd auto_conf (:2379, no certs) can never work here and
            # would now duplicate the cluster check; ignore it on every node agent.
            - name: DD_IGNORE_AUTOCONF
              value: '["etcd"]'
            # 2026-07-03 audit: removed DD_CONTAINER_INCLUDE=name:heffner.live — matched
            # no actual container name (they're nginx/fail2ban/...); dead config that read
            # as if discovery were filtered when it wasn't (include without exclude is a no-op)
        trace-agent:
          env:
            # 2026-09-19 lockdown, part 2. APM stays enabled (USM rides the trace agent and
            # the nginx SLO is built on universal.http.server), but the receiver now binds
            # 127.0.0.1 instead of every interface. In-cluster senders are unaffected: they
            # use /var/run/datadog/apm.socket, which is already configured.
            - name: DD_APM_NON_LOCAL_TRAFFIC
              value: "false"
        system-probe:
          env:
            # Network Path (CNM). Traceroute-style hop-by-hop monitoring of the paths this
            # cluster actually uses outbound — Cloudflare edge, DNS, upstream — so a latency
            # regression can be attributed to a specific hop instead of guessed at.
            #
            # Set here rather than under .spec.features because operator 1.14.0's v2alpha1
            # CRD exposes no `networkPath` feature field (verified against the live CRD).
            # Requires agent 7.55+ (running 7.82.3) and npm.enabled, both already true.
            - name: DD_NETWORK_PATH_CONNECTIONS_MONITORING_ENABLED
              value: "true"
      tolerations:                        # run on the control-plane node too (4/4 nodes)
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
