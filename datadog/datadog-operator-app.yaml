# datadog/datadog-operator-app.yaml  (apply once as cluster-admin during bootstrap)
# Installs the Datadog Operator via Helm into the `datadog` namespace, replacing the
# old `helm install` that lived in `default`. sync-wave 0 so the operator + the
# DatadogAgent CRD are Ready BEFORE the DatadogAgent CR (datadog-agent-app, wave 1).
#
# The agent is declared explicitly in datadog-agent.yaml (single source of truth),
# NOT via Helm. In this chart `datadogAgent.enabled` only toggles the operator's
# DatadogAgent *controller* (the -datadogAgentEnabled arg) and renders NO CR of its
# own — so it stays TRUE (controller on) and datadog-agent-app syncs the CR.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datadog-operator
  namespace: automation                 # ArgoCD lives here (same as kyverno / heffner-prod / shared-services)
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://helm.datadoghq.com
    chart: datadog-operator
    targetRevision: 2.25.1              # operator app v1.29.0
    # 2026-09-02: was 2.9.2 (operator 1.14.0). That operator was too old to grant the
    # cluster agent RBAC for discovery.k8s.io/v1/endpointslices, so the orchestrator
    # check ran with that collector permanently skipped once the cluster agent moved
    # to 7.82.3.
    #
    # Crossing operator v1.21 changes the DaemonSet matchLabels selector from
    # agent.datadoghq.com/name to app.kubernetes.io/instance. Selectors are immutable,
    # so the operator deletes and recreates the DaemonSet, using pod orphaning to keep
    # the running Agent pods alive through it. From v1.21 this is automatic; the
    # agent.datadoghq.com/update-metadata annotation is only for opting in early on
    # v1.18-v1.20. Checked before upgrading: no NetworkPolicies, service mesh or VPAs
    # in this cluster select on those labels, and the only Services that do are managed
    # by the operator itself. See docs/agent_metadata_changes.md upstream.
    helm:
      releaseName: datadog-operator
      values: |
        datadogAgent:
          enabled: true                # enables the operator's DatadogAgent controller (chart renders no CR)
        installCRDs: true
        collectOperatorMetrics: true
        datadogCRDs:
          crds:
            datadogAgents: true
            datadogMetrics: true
            datadogMonitors: true
            datadogPodAutoscalers: true
  destination:
    server: https://kubernetes.default.svc
    namespace: datadog
  syncPolicy:
    automated:
      selfHeal: true
      prune: false                     # don't let a transient parse error prune the operator
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true           # DatadogAgent CRD is large; SSA avoids last-applied bloat
