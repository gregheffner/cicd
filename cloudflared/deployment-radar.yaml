apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-radar
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared-radar
    app.kubernetes.io/part-of: edge
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-radar
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        # Datadog autodiscovery for cloudflared's Prometheus endpoint, which the
        # container already exposes via `--metrics 0.0.0.0:2000` (port `metrics`).
        # Nothing was scraping it, so the tunnels - the ONLY ingress path to the
        # site - had no health telemetry at all.
        #
        # Explicit metric allow-list rather than ".*": the endpoint exposes 63
        # series and Datadog bills custom metrics per series per pod (6 pods here),
        # so ".*" would be ~378 billable series for four useful signals.
        #   ha_connections              - HA connections to the CF edge; the key
        #                                 degradation signal (healthy = 4/replica)
        #   total_requests              - throughput through the tunnel
        #   request_errors              - tunnel-level failures
        #   concurrent_requests_per_tunnel - saturation
        ad.datadoghq.com/cloudflared.checks: |
          {
            "openmetrics": {
              "init_config": {},
              "instances": [
                {
                  "openmetrics_endpoint": "http://%%host%%:2000/metrics",
                  "namespace": "cloudflared",
                  "metrics": [
                    "cloudflared_tunnel_ha_connections",
                    "cloudflared_tunnel_total_requests",
                    "cloudflared_tunnel_request_errors",
                    "cloudflared_tunnel_concurrent_requests_per_tunnel"
                  ]
                }
              ]
            }
          }
      labels:
        app.kubernetes.io/name: cloudflared-radar
        app.kubernetes.io/part-of: edge
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cloudflared-radar
              topologyKey: kubernetes.io/hostname
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: Always
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config.yml
            - --no-autoupdate
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:2000
            - run
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared-creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-radar-config
            items:
              - key: config.yml
                path: config.yml
        - name: creds
          secret:
            secretName: cloudflared-radar-creds
            items:
              - key: credentials.json
                path: credentials.json
