apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: edge
data:
  config.yml: |
    tunnel: 2aa6871b-fdf8-4556-9307-98172d5b243a
    credentials-file: /etc/cloudflared-creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    # 2026-09-01: was `auto`, which selects QUIC when the environment supports it
    # (connectivity pre-checks pass here, so it always picked QUIC over UDP/7844).
    #
    # ~2.6% of ALL requests through this tunnel return 5xx at the Cloudflare edge
    # with originResponseStatus=0 - the origin is never reached. Neither end logs a
    # failure: nginx serves 66k requests with ZERO 5xx, and cloudflared reports 0
    # request_errors, no error log lines and max 7 concurrent requests.
    #
    # It isolates to the tunnel leg. 20h sample by hostname:
    #     greg.heffner.live     6.23%   (through the tunnel)
    #     maintain.heffner.live 22.89%  (through the tunnel)
    #     heffner.live           0.48%  (edge redirect, no origin)
    #     r2.heffner.live        0.00%  (Cloudflare R2, no tunnel)
    # Cloudflare-served hostnames are clean; tunnel-backed ones are not.
    #
    # Forcing http2 moves the tunnel from QUIC/UDP to TLS-over-TCP to test whether
    # UDP loss on the residential link is the cause. Same TLS, same credentials,
    # still outbound-only - no security change. All ingress here is plain HTTP,
    # so nothing needs QUIC (only UDP proxying / WARP-routing would).
    # REVERT: set back to `auto` if the 5xx rate does not improve.
    protocol: http2
    loglevel: info
    grace-period: 30s
    ingress:
      - hostname: greg.heffner.live
        service: http://nginx-service.prod.svc.cluster.local:80
      - hostname: deploy.heffner.live
        service: https://argocd-server.automation.svc.cluster.local:443
        originRequest:
          noTLSVerify: true
      - hostname: watch.heffner.live
        service: http://192.168.1.53:3001
      - hostname: maintain.heffner.live
        service: http://192.168.1.53:3000
      - hostname: view.heffner.live # go2rtc camera relay on dockerhost (behind CF Access; WebRTC won't traverse CF -> players fall back to MSE/WSS)
        service: http://192.168.1.53:1984
      - service: http_status:404
