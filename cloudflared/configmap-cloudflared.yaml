apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: edge
data:
  config.yml: |
    tunnel: 2aa6871b-fdf8-4556-9307-98172d5b243a
    credentials-file: /etc/cloudflared-creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    # 2026-09-01: RESULT OF THE http2 EXPERIMENT - keep `auto`.
    #
    # ~2.6% of requests through this tunnel return 5xx at the Cloudflare edge with
    # originResponseStatus=0. Hypothesis was QUIC/UDP loss on the residential link,
    # so the tunnel was forced to http2 (TLS/TCP) at 17:43Z to test it.
    #
    # It made NO difference - 5xx kept accruing at the same ~6/min after the switch.
    # Transport is NOT the cause. Reverting to `auto` so QUIC is used when healthy.
    #
    # What the 5xx actually are: Datadog synthetic probes. Evidence:
    #   - only on synthetic target paths (/, /blog.html, /privacy.html,
    #     /image/site.webmanifest - the last is fetched via <link rel=manifest>
    #     on every browser-test page load)
    #   - only from US/CA, the probe regions
    #   - every one has proto=UNK and originResponseStatus=0, i.e. the request never
    #     completed rather than failed
    #   - count is pinned at exactly 360/hr while organic traffic swings 47%,
    #     because probes run on fixed schedules
    #   - nginx logs ZERO 5xx; cloudflared logs zero request_errors
    # Browser synthetics abort in-flight resource requests at session teardown;
    # Cloudflare records those as 5xx. Measurement artifact, not user impact.
    protocol: auto
    # TEMPORARY DIAGNOSTIC - revert to `info` once the capture window is done.
    # Testing whether the ~360/hr 503s Cloudflare reports ever reach this connector.
    # Evidence so far says they do not: httpRequestsAdaptiveGroups over 20h contains
    # 14 status codes across 284k requests - including a single 401 and three 520s -
    # but ZERO 503s, while responseStatusMap reports ~7,200 for the same window.
    # That rules out sampling and implies they are never proxied requests at all.
    # debug logs every request the connector receives, so an absence at the expected
    # 6/min is positive proof they never arrive here.
    # NOTE: ~300k req/day - this is verbose. Do not leave enabled.
    loglevel: debug
    grace-period: 30s
    ingress:
      - hostname: greg.heffner.live
        service: http://nginx-service.prod.svc.cluster.local:80
      - hostname: deploy.heffner.live
        service: https://argocd-server.automation.svc.cluster.local:443
        originRequest:
          noTLSVerify: true
      - hostname: watch.heffner.live
        service: http://192.168.1.53:3001
      - hostname: maintain.heffner.live
        service: http://192.168.1.53:3000
      - hostname: view.heffner.live # go2rtc camera relay on dockerhost (behind CF Access; WebRTC won't traverse CF -> players fall back to MSE/WSS)
        service: http://192.168.1.53:1984
      - service: http_status:404
