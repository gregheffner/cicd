# ArgoCD Application for the Mustang Mafia site. Bootstrap-once like the other
# *-app.yaml files: after this merges, run
#   kubectl apply -f https://raw.githubusercontent.com/gregheffner/cicd/main/mustangmafia/mustangmafia-app.yaml
# Edits to THIS file need that re-apply; edits to the files it includes sync on push.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mustangmafia
  namespace: automation
spec:
  project: default
  source:
    repoURL: https://github.com/gregheffner/cicd
    targetRevision: HEAD
    path: mustangmafia
    directory:
      include: '{namespace.yaml,serviceaccount.yaml,nginx-config.yaml,service.yaml,deployment-web.yaml,deployment-cloudflared.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: mustangmafia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
